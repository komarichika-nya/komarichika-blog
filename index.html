<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
    <title>KomariChika♡ </title>
    <link rel="stylesheet" href="s1.css">
    <style>
      .feed { margin-top: 32px; }

      .feed-item {
        display: block;
        padding: 3px 0;
      }
      .feed-line {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .feed-title {
        font-size: 0.9rem;
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }
      .feed-item:hover .feed-title { text-decoration: underline; }
      .feed-item time {
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main>
        <article>
            <p>Hi, I'm KomariChika. An oier(AFO), hacker. computer graphic. I love math btw.</p>
        </article>
        <section class="feed">
            <div id="feed"></div>
        </section>
    </main>
    <footer>
        <div class="social-links"></div>
        <a href="https://github.com/komarichika-nya" style="font-weight: bold;">Github</a>
        <a href="https://x.com/Theshine891403" style="font-weight: bold;">twitter</a>
        <a href="mailto:xdefan101@gmail.com" style="font-weight: bold;">mail</a>
        <p>© 2026 KomariChika</p>
    </footer>

    <script>
      const posts = [
        { title: "microsurface",        url: "post/render/microsurface.html",     date: "2026-05-20" },
        { title: "Light Sample",                url: "post/render/brdf.html",              date: "2026-09-18" },
        { title: "group(1)",               url: "post/math/Group.html",               date: "2026-07-02" },
        { title: "group(2)",                url:"post/math/subgroup.html",             date: "2026-07-07" },
        { title: "pseudorandom-number", url: "post/render/sample.html",            date: "2026-09-27" },
        { title: "number",              url: "post/math/num.html",                 date: "2025-11-15" },
        { title: "Miscellaneous",       url: "post/math/toy.html",                 date: "2025-08-20" },
        { title: "some interesting problems(solved)", url: "post/math/solved.html",         date: "2026-07-01" },
        { title: "Life",                url: "post/life/index.html",               date: "2026-09-27" },
        { title: "some interesting problems(unsolved)", url: "post/math/unsolve.html", date: "2026-07-01"},
        { title: "novel-chapter-I",      url:"post/lv/chapter-1.html",           date:"2026-09-20"}
      ];

      const fmt = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "short", day: "numeric" });
      const feedEl = document.getElementById("feed");

      const sorted = [...posts].sort((a, b) => b.date.localeCompare(a.date));

      for (const p of sorted) {
        const a = document.createElement("a");
        a.className = "feed-item";
        a.href = p.url;
        a.innerHTML =
          '<div class="feed-line">' +
            '<span class="feed-title">' + p.title + '</span>' +
            '<time datetime="' + p.date + '">' + fmt.format(new Date(p.date + "T00:00:00")) + '</time>' +
          '</div>';
        feedEl.appendChild(a);
      }
    </script>
</body>
</html>
